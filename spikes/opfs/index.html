<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spike 3 — OPFS persistence</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1f16;
        --muted: #5c6654;
        --bg: #e8efe0;
        --panel: #f4f7f0;
        --accent: #2f5d3a;
        --line: #c5d0b8;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(ellipse 80% 50% at 10% 0%, #d5e4c8, transparent),
          var(--bg);
        color: var(--ink);
        padding: 2rem;
      }
      h1 {
        font-family: "IBM Plex Serif", Georgia, serif;
        font-weight: 600;
        font-size: 1.75rem;
        margin: 0 0 0.25rem;
      }
      .sub {
        color: var(--muted);
        margin-bottom: 1.25rem;
      }
      #status {
        display: inline-block;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.85rem;
        padding: 0.2rem 0.5rem;
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 1rem 0;
      }
      button {
        font: inherit;
        padding: 0.5rem 0.9rem;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #f4f7f0;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--accent);
      }
      #log {
        white-space: pre-wrap;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 1rem;
        min-height: 12rem;
        max-width: 48rem;
      }
    </style>
  </head>
  <body data-status="loading">
    <h1>Spike 3 — OPFS</h1>
    <p class="sub">
      Engine <code>os.WriteFile</code> → WASI preopen → OPFS; survives reload.
      Status: <span id="status">loading</span>
    </p>
    <div class="row">
      <button id="btn-write" type="button">Write /hello.txt</button>
      <button id="btn-read" type="button" class="secondary">Read /hello.txt</button>
      <button id="btn-reload" type="button" class="secondary">Reload page</button>
    </div>
    <pre id="log"></pre>
    <script type="module" src="./app.js"></script>
  </body>
</html>
