version: v2
# wellknowntypes supplies google/protobuf/descriptor.proto for custom options
# (Decision 29 method_id / field metadata). See spikes/options/.
deps:
  - buf.build/protocolbuffers/wellknowntypes
modules:
  - path: .
lint:
  use:
    - STANDARD
breaking:
  use:
    - WIRE_JSON # guard both binary + canonical-JSON compatibility
