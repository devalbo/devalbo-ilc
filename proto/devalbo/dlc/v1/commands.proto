syntax = "proto3";

package devalbo.dlc.v1;

option go_package = "github.com/devalbo/devalbo-ilc/gen/go/devalbo/dlc/v1;dlcv1";

import "devalbo/options/v1/options.proto";

// `dlc`'s OWN command surface (Decision 29) — App #1's app-specific verbs, and
// nothing else. The filesystem/bundle/version verbs every app inherits live in
// `devalbo/ilc/v1/platform.proto`; dlc depends on them exactly the way a
// scaffolded app does, which is what keeps the platform boundary honest.
//
// Each command is one rpc carrying a permanent `method_id` in the **app band
// (10000+)**. 1–9999 is reserved for ILC itself, in per-capability blocks (see
// platform.proto) — `dlc` is an app like any other and claims no id below the
// line. The engine
// dispatches on that number through one flat `map[u32]handler`, so the rpc
// *name* is cosmetic and renaming is wire-safe.
//
// Only **in-engine** commands live here (Decision 30): verbs that touch nothing
// but the filesystem / app-data, so they run in the terminal *and* the browser.
// Toolchain verbs (build, run, verify, doctor, gen, host add, proto) are
// host-side orchestration — they spawn processes and inspect the machine, so
// they never cross into the engine and are absent from this service.
//
// Request/response messages cross the boundary **directly** (flat, single
// encode — Spike 2): `execute(method: u32, request: list<u8>) -> command-result`
// (Decision 31). There is no oneof envelope; the discriminator is the scalar
// method_id parameter.
service DlcService {
  // Scaffold a new ILC project
  rpc New(NewRequest) returns (NewResponse) {
    option (devalbo.options.v1.method_id) = 10000;
  }
  // Echo the words back, through the engine
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (devalbo.options.v1.method_id) = 10001;
  }
}

// Failure is carried by the `command-result` envelope (success + error), not by
// response fields — so no response here has an error member.

// `dlc new <app> [--module …] [--caps …] [--tiers …] [--ui …] [--storage …]`
message NewRequest {
  string name = 1 [
    (devalbo.options.v1.help) = "project/app name",
    (devalbo.options.v1.required) = true,
    // `dlc new myapp`, not `dlc new --name myapp`. The flag spelling still
    // works, so existing scripts keep parsing.
    (devalbo.options.v1.cli_positional) = 1
  ];
  string module = 2 [
    (devalbo.options.v1.help) = "Go module path (default github.com/you/<app>)",
    (devalbo.options.v1.short) = "m"
  ];
  // Capability opt-ins (bootstrap: console, filesystem). Stays `repeated string`
  // rather than an enum until the cap set stops moving; enums here would become
  // menu choices host-side, which is the eventual shape.
  repeated string caps = 3 [
    (devalbo.options.v1.help) = "capability opt-ins (console, filesystem)"
  ];
  repeated string tiers = 4 [
    (devalbo.options.v1.help) = "tier opt-ins (native, web)"
  ];
  // NO DEFAULT, deliberately. This declared `UI_KIND_REACT` while the engine
  // rejected anything but UNSPECIFIED — the template scaffolds a vanilla-TS UI.
  // The hand-written host never sent the field, so the claim was decorative and
  // stayed false for free; the generated CLI applies declared defaults, so
  // `dlc new myapp` failed outright the moment dlc ate its own surface. Restore
  // a default when there is a UI kind the engine actually accepts.
  UiKind ui = 5 [
    (devalbo.options.v1.help) = "UI to scaffold"
  ];
  // Same story as `ui` above: declared STORAGE_KIND_SPLIT, engine accepts only
  // UNSPECIFIED.
  StorageKind storage = 6 [
    (devalbo.options.v1.help) = "storage layout"
  ];
  // BOOTSTRAP: path to a local devalbo-ilc checkout, written into the generated
  // go.mod as a `replace`. Needed only until ilc-platform is published — see
  // platformReplace() in engine/scaffold.go.
  string platform_path = 7 [
    (devalbo.options.v1.help) = "local devalbo-ilc checkout (bootstrap; until ilc-platform is published)"
  ];
}
message NewResponse {
  string path = 1;             // where the project was scaffolded
  repeated string files = 2;   // files written
}

message EchoRequest {
  repeated string args = 1 [
    (devalbo.options.v1.help) = "words to echo back",
    // Repeated AND positional, so it takes the remainder: `dlc echo one two`.
    (devalbo.options.v1.cli_positional) = 1
  ];
}
message EchoResponse {
  string text = 1;
}

// Proto enums are the native source of host-side menu choices (Decision 29) —
// the host turns them into `huh` selects / a <select> without extra metadata.
enum UiKind {
  UI_KIND_UNSPECIFIED = 0;
  UI_KIND_REACT = 1;
  UI_KIND_NONE = 2;
}

enum StorageKind {
  STORAGE_KIND_UNSPECIFIED = 0;
  STORAGE_KIND_SPLIT = 1;
  STORAGE_KIND_NONE = 2;
}
