[package]
name = "ilc-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ILC compiler: WIT → TypeScript / Python / Rust"

[[bin]]
name = "ilc"
path = "src/main.rs"

[lib]
name = "ilc_compiler"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
wit-parser = "0.220"

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
