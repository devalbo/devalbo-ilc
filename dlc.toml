# dlc — what this project IS.
#
# dlc is an app like any other (AGENTS.md §3), so it declares itself the way a
# scaffolded app does. It had no manifest until now, which meant the ONE app
# exempt from the rules `dlc` enforces on everyone else was `dlc`.
#
# Read by the host-side toolchain only. The ENGINE never reads it.

[project]
name    = "dlc"
version = "0.0.0-bootstrap"
module  = "github.com/devalbo/devalbo-ilc"

# No [platform] path: dlc IS the platform. A scaffolded app points back here.

[tiers.native]
capabilities = ["console", "filesystem"]
# NOTE THE COLLISION, and that it is deliberate. For an app, `hosts/native/` is
# the tier slot. Here it is BOTH the slot (dlc's own commands.go, build.go,
# gen.go). The RUNTIME half is gone — the CLI runner now lives in
# `dlc-platform/cli` — so what is left is dlc's slot plus dlc's toolchain, which
# is a normal thing for an app to have.
root      = "hosts/native"

[tiers.web]
capabilities = ["console", "filesystem"]
# `hosts/web/` — the same name every app uses. It was `frontend/` until the
# platform extraction (§16.4) moved the inherited runtime to `dlc-platform/web`
# and freed this name. dlc is no longer the exception it used to be here.
root      = "hosts/web"
assets    = "hosts/web/src/wasm"
component = "engine.component.wasm"
