version: v2
# Reflection-free codegen (TinyGo-safe): Aperture Robotics' go-lite / es-lite.
# NOTE: exact `opt` flags validated on the first `buf generate` under devbox (Spike 2).
plugins:
  - local: protoc-gen-go-lite
    out: dlc-platform/gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-es-lite
    out: dlc-platform/gen/ts
    opt:
      - target=ts
  # Command dispatch + method_id constants, generated from the service defs that
  # go-lite ignores (it emits messages only). Also enforces the id lock — see
  # cmd/protoc-gen-dlc-registry. `go run` keeps it buildable from a fresh clone
  # with no install step; cwd here is proto/.
  - local: ["go", "run", "github.com/devalbo/devalbo-ilc/dlc-platform/cmd/protoc-gen-dlc-registry"]
    out: dlc-platform/gen/go
    # strategy: all — buf's DEFAULT is `directory`, which invokes a plugin once
    # per directory. The id lock needs every service in ONE invocation, or each
    # call writes a lock holding only its own directory's ids and the next call
    # fails against it.
    strategy: all
    opt:
      - paths=source_relative
      - lock=dlc-platform/proto/method-ids.lock
  # The same ids for the web tier. buf runs a plugin once per output directory,
  # so this is a second invocation with lang=ts rather than one emitting both.
  # No lock here — one writer is enough, and two would race on the same file.
  - local: ["go", "run", "github.com/devalbo/devalbo-ilc/dlc-platform/cmd/protoc-gen-dlc-registry"]
    out: dlc-platform/gen/ts
    strategy: all
    opt:
      - paths=source_relative
      - lang=ts
  # And the enum VALUES for the badge, which hand-decodes protobuf because it is
  # no_std and cannot run protoc. Those numbers were retyped into control.rs by
  # a person — 41 of them — and one transcription was wrong for a day: TextOutlet
  # as DISPLAY=2, UART=3, which is alphabetical order rather than declared order.
  - local: ["go", "run", "github.com/devalbo/devalbo-ilc/dlc-platform/cmd/protoc-gen-dlc-registry"]
    out: dlc-platform/gen/rust
    strategy: all
    opt:
      - paths=source_relative
      - lang=rust
  # The same values for the web package, written INSIDE it. `dlc-platform/web`
  # is an npm package root: a path outside it is neither shipped nor resolvable,
  # which is why these were hand-written there.
  - local: ["go", "run", "github.com/devalbo/devalbo-ilc/dlc-platform/cmd/protoc-gen-dlc-registry"]
    out: dlc-platform/web/gen
    strategy: all
    opt:
      - paths=source_relative
      - lang=ts
      - only=enums
