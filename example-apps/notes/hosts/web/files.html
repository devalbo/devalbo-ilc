<!doctype html>
<!--
  notes' OPFS browser.

  §7.1 says the files are the truth — one readable JSON file per record. In a
  terminal you can `ls` and `cat` them; in a browser OPFS has no Finder, so this
  page is how that claim gets checked by eye on this tier.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>notes — files</title>
  </head>
  <body>
    <h1>notes — files</h1>
    <p>
      Everything the engine has written to OPFS. Read-only: the engine holds its
      filesystem preopen from instantiation, so writing here behind its back
      would be a second writer it cannot see. Use <code>import-fs</code> in the
      <a href="/terminal.html">terminal</a> instead. <a href="/">back to the app</a>
    </p>
    <div id="files" class="ilc-files"></div>
    <script type="module" src="/src/files.ts"></script>
  </body>
</html>
