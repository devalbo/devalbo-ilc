<!doctype html>
<!--
  A page with NO app script.

  The slot test needs notes' real markup driven by a fake engine, and the real
  index.html loads main.ts, which connects to a live component in a worker. So
  this page loads nothing: the driver fetches index.html, mounts the view found
  inside it, and hands it a fake port.

  Fetching rather than copying the form here is the point — a duplicated <form>
  would drift from the real one silently, and then the slot test would be
  rendering markup no user ever sees.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>notes — slot harness</title>
  </head>
  <body>
    <div id="harness"></div>
  </body>
</html>
