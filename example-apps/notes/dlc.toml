# notes — what this project IS.
#
# Read by `dlc` (host-side toolchain only). The ENGINE never reads it: anything
# it needs from here becomes GENERATED code via `dlc gen`.

[project]
name    = "notes"
version = "0.1.0"
module  = "github.com/devalbo/devalbo-ilc/example-apps/notes"

[platform]
# BOOTSTRAP: relative, so this works on any machine and in CI.
path = "../.."

# `root` is this tier's SLOT — the directory holding this app's host code for
# that tier (Decision 34). One slot per tier, and it must exist: a declared tier
# with no slot is a tier nobody can write host code for, so `dlc` refuses it
# rather than building something with no front end.

[tiers.native]
capabilities = ["console", "filesystem"]
root      = "hosts/native"

[tiers.web]
capabilities = ["console", "filesystem"]
root      = "hosts/web"
assets    = "hosts/web/src/wasm"
component = "build/engine.component.wasm"
