syntax = "proto3";

package notes.v1;

option go_package = "github.com/devalbo/devalbo-ilc/example-apps/notes/gen/go/notes/v1;notesv1";

import "devalbo/options/v1/options.proto";

// notes — App #2, the breadth pilot (§13).
//
// Its job is to be the first app that USES the ILC platform rather than being
// it, and to drive out the capabilities the platform still lacks: a real index,
// events, and split storage. Where it needs something that does not exist yet,
// that absence is the finding.
//
// METHOD IDS — 1–9999 is ILC's; yours start at 10000.
service NotesService {
  // Write a new note
  rpc CreateRecord(CreateRecordRequest) returns (CreateRecordResponse) {
    option (devalbo.options.v1.method_id) = 10000;
    // The CLI says `notes create`; the rpc stays CreateRecord. Cosmetic —
    // dispatch is on method_id, so this is not a breaking change.
    option (devalbo.options.v1.cli_name) = "create";
  }
  // List every note, id and title
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse) {
    option (devalbo.options.v1.method_id) = 10001;
    option (devalbo.options.v1.cli_name) = "list";
  }
  // Print one note in full
  rpc OpenRecord(OpenRecordRequest) returns (OpenRecordResponse) {
    option (devalbo.options.v1.method_id) = 10002;
    option (devalbo.options.v1.cli_name) = "open";
  }
  // Remove a note
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse) {
    option (devalbo.options.v1.method_id) = 10003;
    option (devalbo.options.v1.cli_name) = "delete";
  }

  // Held for the capabilities this app is meant to drive out (§13) — declared,
  // not commented, so the numbers cannot be claimed twice in the meantime.
  //   10004 = UpdateRecord
  option (devalbo.options.v1.reserved_method_id) = 10004;
}

// A note. Stored as ONE canonical-JSON file per record (§7.1 split storage):
// the file is the source of truth, and any index over it is disposable.
message Record {
  string id = 1;
  string title = 2;
  string body = 3;
  // Seconds since the epoch. Not a timestamp type: the engine has no clock
  // capability yet, so the HOST supplies this — one of the gaps this app exists
  // to surface.
  int64 created_at = 4;
}

message CreateRecordRequest {
  string title = 1 [
    (devalbo.options.v1.help) = "note title",
    (devalbo.options.v1.required) = true,
    // Positional, so `create "Buy milk" "two litres"` works the way the
    // hand-written CLI did. `--title` still works too.
    (devalbo.options.v1.cli_positional) = 1
  ];
  string body = 2 [
    (devalbo.options.v1.help) = "note body",
    (devalbo.options.v1.cli_positional) = 2
  ];
  int64 created_at = 3 [(devalbo.options.v1.help) = "seconds since epoch (host-supplied)"];
}
message CreateRecordResponse {
  Record record = 1;
  string path = 2; // where it landed, relative to the filesystem root
}

// RecordEntry is the PROJECTION the derived index stores — one per record,
// holding what a list view renders and nothing more (docs/INDEX-PLAN.md D6).
//
// The index is never authoritative. `open` reads the record's own file, because
// the moment a handler renders a value out of the index, the index is a second
// source of truth and a stale row reaches a user. What is here is a CACHE of
// exactly what `list` draws, and a cache that disagrees with a file is a bug
// `rebuild-index` fixes.
//
// Widening this is a deliberate act, not a convenience. Every field added is a
// value that can go stale between a write and a rebuild.
message RecordEntry {
  string id = 1;
  string title = 2;
  // The first line of the body, CAPPED. Bounded on purpose: an index that stored
  // whole bodies would be the whole store, which is why the plan rules out
  // full-text search rather than nearly-implementing it. Hosts still truncate
  // this to their own width — where to cut a line for a 24-column table is
  // presentation, and presentation is the slot's (Decision 34).
  string body_preview = 3;
  int64 created_at = 4;
}

message ListRecordsRequest {}
message ListRecordsResponse {
  // A projection served from the index, not whole records read by opening every
  // file. A list literally CANNOT render a stale body, because it has none.
  repeated RecordEntry entries = 1;
}

message OpenRecordRequest {
  string id = 1 [
    (devalbo.options.v1.help) = "record id",
    (devalbo.options.v1.required) = true,
    (devalbo.options.v1.cli_positional) = 1
  ];
}
message OpenRecordResponse {
  Record record = 1;
}

message DeleteRecordRequest {
  string id = 1 [
    (devalbo.options.v1.help) = "record id",
    (devalbo.options.v1.required) = true,
    (devalbo.options.v1.cli_positional) = 1
  ];
}
message DeleteRecordResponse {
  bool deleted = 1;
}

// ---- events (§6.3) --------------------------------------------------------

// RecordChangedEvent is the payload of notes' own `notes.record-changed` topic:
// "a record appeared or vanished, re-read the list".
//
// An APP-DEFINED topic and an app-defined payload, in the app's own .proto —
// that is the pattern the platform's `ilc.data-changed` establishes and this
// inherits. Nothing had to be registered to say it: topics are namespaced
// strings, so `notes.` is notes' to spend (whereas method ids come from a band).
//
// Deliberately NOT a diff, for the same reason DataChangedEvent is not: the file
// is the truth (§7.1). Carrying the record itself would let a subscriber render
// state it never read from the store, and the two would drift.
message RecordChangedEvent {
  option (devalbo.options.v1.topic) = "notes.record-changed";

  // The record that changed. Present even for a delete — a subscriber watching
  // one note wants to know it is gone.
  string id = 1;
  // The command that caused it, as a method_id: create and delete are told
  // apart by the number, not by a second enum that could disagree with it.
  uint32 method = 2;
}
