syntax = "proto3";

package devalbo.ilc.v1;

option go_package = "github.com/devalbo/devalbo-ilc/dlc-platform/gen/go/devalbo/ilc/v1;ilcv1";

// For `TextOutlet` and `WorldName`.
//
// WHAT A WORLD IS is not a control-channel fact: an APP asks the same questions
// through its manifest, and a second copy of these enums here would be two
// vocabularies to keep in step. They were defined here first only because the
// control channel needed them first — and they now live in the file named for
// the idea rather than in either consumer.
// For `since` and `renamed_from` — when a field arrived, and what it used to be
// called. See the note on those options: `reserved` records removals and the id
// lock records ids, but nothing recorded arrivals or renames.
import "devalbo/options/v1/options.proto";
import "devalbo/ilc/v1/world_manifest.proto";
import "devalbo/ilc/v1/world_name.proto";

// Driving a WORLD from outside it (docs/BADGE-CONTROL-PLAN.md).
//
// Not a command surface. Every message here is a question about the WORLD — what
// it is, what is on its screen, which button was pressed — and none of them
// reach an app. An app cannot send these, cannot receive them, and cannot detect
// that a world is being driven (D6).
//
// WORLD-AGNOSTIC ON PURPOSE (D1a). Nothing here mentions a pin, a panel or
// flash: a badge answers over framed USB CDC, and a browser world answers over
// postMessage, with the same vocabulary. That is what lets the same command
// sequence drive both and their answers be compared (D7) — the difference
// between an emulator and the hardware it emulates, rather than two intentions.
//
// NO SERVICE, and no method ids. These are not engine commands: the engine
// dispatches `execute(method_id, bytes)` and knows nothing about worlds. Putting
// a service here would put world verbs in the same numbering space as app
// commands, which is exactly the confusion the two permanent bands exist to
// prevent.

// What a world is and what it is doing.
//
// The first verb, because it answers the question that has cost the most time:
// "is the badge stuck, or is the log stuck?" A one-way log cannot distinguish
// those, and three debugging cycles went on that ambiguity in one session.
message WorldState {
  // WHAT THIS WORLD IS, as values rather than as words.
  //
  // These were `string world`, `string tier` and a `map<string, string> config`,
  // and every one of them was an enum at BOTH ends: `BadgeWorld`, a tier name, a
  // `ScreenLayout`. The world rendered them to prose, the wire carried prose,
  // and the client compared prose — so a rename anywhere silently broke every
  // assertion, and nothing could enumerate the legal values.
  //
  // The map carried the note "as strings so a new knob does not need a new
  // field", which is the argument that always precedes losing the types. What it
  // actually bought was that a typo in a key produced a world with no screen
  // layout instead of a compile error.
  // THE NUMBERS ARE RESERVED, THE NAMES ARE REUSED. A field number is the wire
  // identity — reusing 1 would make an old client decode a `WorldKind` as the
  // string it used to be. The NAME is just what the question is called, and it
  // is still the right name; `config` is gone entirely.
  reserved 1, 2, 4;

  WorldName world = 9;
  Tier tier = 10;
  // Firmware or host version. GENUINELY A STRING: a semver is not a closed set.
  string version = 3;

  // The flash-time choices, one field each.
  ScreenLayout screen = 11;
  InputMode input = 12;
  TextOutlet text = 13;

  // WHAT IT IS DOING RIGHT NOW — the field this verb exists for.
  Activity activity = 5;

  // The app currently instantiated, or empty. A NAME, so a string: an app is
  // whatever somebody dragged onto the payload region.
  string app = 6;

  // WHAT THE APP LAST SAID IT WAS DOING, or empty.
  //
  // `activity` above is the WORLD's: `RUNNING` means a guest is executing and
  // nothing more. A countdown on tick 3 and an import on file 400 are both
  // `RUNNING`, which is exactly the resolution a stuck-or-slow question needs.
  //
  // Only the app knows, so the app says — through the reserved `ilc.activity`
  // event, which arrives WHILE the command runs because `emit` is an import. The
  // dispatcher publishes the command's name by default, so an app that never
  // mentions activity still reports something true.
  //
  // FREE TEXT ON PURPOSE, and the one place here that should be: the world
  // cannot know an app's vocabulary, and inventing an enum for it would mean
  // every app had to describe itself in the world's words.
  string app_activity = 8;

  // Milliseconds since boot. Lets a caller tell a world that is progressing
  // slowly from one that has stopped, without watching two answers arrive.
  uint64 uptime_ms = 7;

  // PASS-THROUGH BOOKKEEPING, for the question a client cannot answer alone.
  //
  // "I sent a request and nothing happened" has three causes that are identical
  // from the far end of a cable: it never arrived, it arrived and was refused,
  // or it arrived and nobody collected it. One counter separates the first from
  // the rest, and the pair separates the second from the third.
  //
  // Diagnostic, and kept: this cost an afternoon of writing throwaway probes to
  // guess at it, which is exactly the work a control channel exists to make
  // unnecessary.
  uint32 requests_offered = 14;
  uint32 requests_taken = 15;
  // Whether a DLC instance is live and could run a request at all.
  //
  // THE NUMBER STAYS, THE NAME CHANGES — a field number is the wire identity and
  // 16 has always meant this. It was `session_open`, which named the same thing
  // as `PHASE_SESSION` while outliving it by a whole phase; "instance" is the
  // thing with a lifetime.
  bool instance_open = 16 [
    (devalbo.options.v1.renamed_from) = "session_open"
  ];

  // WHERE THE WORLD IS IN ITS OWN LIFE, at two resolutions.
  //
  // `activity` above answers "what kind of thing is it doing" and is deliberately
  // coarse. These answer "how far has it got", which is the question a badge that
  // has not finished booting needs to be able to answer — and could not, because
  // stages lived only in a log that a stalled bring-up never finished writing.
  //
  // Both are published as the world enters them, from values that need no heap,
  // so they are readable in the window where boot hangs are actually found.
  Phase phase = 17 [(devalbo.options.v1.since) = "0.2.0"];
  // The stage within that phase, or `STAGE_UNSPECIFIED` between stages.
  Stage stage = 18 [(devalbo.options.v1.since) = "0.2.0"];

  // How many transitions the world took that its own table calls impossible.
  //
  // ZERO ON A HEALTHY WORLD, and a firmware bug otherwise: the phases form a
  // state machine, and this counts the edges that are not in it. On the wire
  // rather than only in the log because a fault nobody was watching for is
  // exactly the one worth catching — a client seeing a non-zero count knows to
  // go and find the line that explains it.
  uint32 phase_faults = 19 [(devalbo.options.v1.since) = "0.2.0"];

  // WHICH BUILD OF THE WORLD THIS IS.
  //
  // `version` above is the firmware's semver, and it has been "0.1.0" since the
  // first commit — it answers "which release" and cannot answer "is the board
  // running what I just built". That second question is the one that actually
  // costs time: a flash that silently did not take looks exactly like a change
  // that did not work, and this session lost an investigation to precisely that
  // ambiguity before the reboot path was fixed.
  //
  // Set at compile time and CHANGES WHEN THE BINARY DOES, so a host can compare
  // it against the artifact it just produced. The payload catalog already
  // learned this and prints a checksum per entry, because size alone could not
  // say which build a payload was.
  string build_id = 21 [(devalbo.options.v1.since) = "0.2.0"];
  // WHAT THE APP CALLS ITSELF — the app's own version, not the world's.
  //
  // Read from the app once, at instantiation, through the `Version` verb every
  // app inherits. `app` above says WHICH app; this says which build of it, and
  // the two together are what make a bug report reproducible.
  string app_version = 22 [(devalbo.options.v1.since) = "0.2.0"];

  // HOW THE LAST THING WENT — the badge's own judgement, as a value.
  //
  // The same one the panel shows as a colour and the log prints as a word, which
  // until now were its only outlets: a client had to read prose to learn it.
  Verdict verdict = 20 [(devalbo.options.v1.since) = "0.2.0"];
}

// THE WORLD'S OWN JUDGEMENT of how the last thing it did went.
//
// # Why this is on the wire at all
//
// It was not, and it is the oldest thing the badge says: a colour on the panel
// and a word at the end of the log. Both reach a PERSON. A client had to scrape
// `verdict: OK` out of log prose to learn it — which is exactly the "parse the
// text to find out what happened" that this whole channel exists to replace, and
// it is fragile in the usual way: the word is produced by `Status::name`, so
// renaming a state silently breaks every reader.
//
// # Why it is separate from `Activity` and `Phase`
//
// They answer *where* and *what is it doing*; this answers *how did it go*. A
// world can be `INSTANCE_RUNNING`, `ACTIVITY_RESTING` and `VERDICT_FAILED` all
// at once, and each of the three is the only one that can say its own thing.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  // Ran, and the command reported success.
  VERDICT_OK = 1;
  // Ran, and the command reported failure. NOT a crash — an app-level error.
  VERDICT_FAILED = 2;
  // Alive, with nothing to run. A badge waiting for a payload has done
  // everything asked of it, which is why this is a verdict and not a failure.
  VERDICT_IDLE = 3;
  // Could not get far enough to have an opinion: instantiation failed, or the
  // board did not come up.
  VERDICT_BROKEN = 4;
}

// Where a world is in its own sequence.
//
// Coarse deliberately. A caller wants to know whether to keep waiting, not to
// reconstruct the firmware's control flow — and a fine-grained enum would need
// updating every time a stage moves.
enum Activity {
  ACTIVITY_UNSPECIFIED = 0;
  // Bring-up: clocks, buses, the panel, the payload region.
  ACTIVITY_STARTING = 1;
  // Offering the payload menu.
  ACTIVITY_CHOOSING = 2;
  // Collecting input for a command.
  ACTIVITY_COLLECTING = 3;
  // Inside `execute`. A world reports this WHILE the guest runs, which is the
  // whole reason the answer is serviced from `block_on`'s pump (D5).
  ACTIVITY_RUNNING = 4;
  // Finished, showing a result.
  ACTIVITY_RESTING = 5;
}




// How a world divides its panel. Mirrors `ScreenLayout` in world.rs.
enum ScreenLayout {
  SCREEN_LAYOUT_UNSPECIFIED = 0;
  // A world band across the top, the app underneath.
  SCREEN_LAYOUT_SPLIT = 1;
  // The app gets everything.
  SCREEN_LAYOUT_FULL = 2;
  // There is no panel.
  SCREEN_LAYOUT_NONE = 3;
}

// Whether a world can collect text, and how. Mirrors `BADGE_INPUT`.
enum InputMode {
  INPUT_MODE_UNSPECIFIED = 0;
  // The world will not ask for input, so an app that needs some cannot run here.
  INPUT_MODE_OFF = 1;
  // The character strip and the number spinner (WORLD-INPUT-PLAN D3).
  INPUT_MODE_KEYBOARD = 2;
}

// A high-level step of the world's own life, and the thing STAGES belong to.
//
// # Why two levels rather than one longer list
//
// The bring-up was nine stages in one flat sequence, run by a single ~1000-line
// function. Reading it, there was no way to answer the question that actually
// comes up — "is this a new high-level step, or part of one that already
// exists?" — because both looked identical: another entry in the same list.
//
// A phase is a step of the world's life that a person would name unprompted:
// bring the board up, find out what is installed, open a session on one of them,
// run it. Each owns a contiguous run of stages, and each is one call in the
// world's entry point — so the entry point IS the outline, and a new phase is a
// new line there rather than a stage appended to a list.
//
// # Why it is on the wire
//
// A phase is answerable when a stage is not. Stages come from a report that only
// exists once the log is up; the phase is a single value published as the world
// enters it, so a client can be told "hardware, stage 4" by a world that has not
// finished booting — which is exactly the world you need to ask.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  // Clocks, the panel, PSRAM: everything that must be true before software runs.
  PHASE_HARDWARE = 1;
  // What is installed, and which of it can run.
  PHASE_PAYLOADS = 2;
  // A DLC INSTANCE COMING UP: choosing a payload, verifying it, instantiating
  // it, and telling it what this world is.
  //
  // "INSTANCE" RATHER THAN "SESSION", which this was called and which named two
  // different-sized things. A session opened partway through this phase and
  // lived through every turn of the next one, so the phase shared a word with a
  // lifetime that outlasted it — and "is a session running?" had no single
  // answer. The instance is the thing with a lifetime; these phases are what is
  // happening to it.
  PHASE_INSTANCE_STARTING = 3;
  // A DLC INSTANCE IN USE: turns of collect, execute, show. The phase a working
  // badge lives in.
  PHASE_INSTANCE_RUNNING = 4;
  // A DLC INSTANCE GOING AWAY: dropping it and accounting for what it held.
  //
  // A PHASE BECAUSE THE TEARDOWN CAN BE THE PROBLEM. Dropping an instance
  // releases 2.9 MB of an 8 MB heap, and a session that leaks even a few hundred
  // KB hangs the badge two or three apps later — which looks like a hardware
  // fault and is the worst thing here to debug. A badge stuck HERE is a
  // different diagnosis from one stuck coming up, and the old edge from running
  // straight back to starting could not express that the teardown happened at
  // all.
  PHASE_INSTANCE_STOPPING = 8;

  // Alive, nothing running, waiting for something to run.
  //
  // NOT AN ENDING, and it used to be one. `rest()` never returned: a badge with
  // an empty catalog, or one whose payload would not instantiate, halted with a
  // colour on the panel and served its log forever. That conflated two different
  // things — "cannot make progress on the app flow" and "stop executing" — and
  // the second does not follow from the first. A badge with no usable heap can
  // still answer questions, show a menu, take a payload over USB and be
  // rebooted; halting removed all of that at exactly the moment somebody needed
  // it, since the PSRAM failure is the one you most want to interrogate.
  //
  // So this waits rather than stops, and every way in has a way out.
  PHASE_IDLE = 5;

  // The world cannot say which phase it is in.
  //
  // Entered when its own bookkeeping contradicts itself — a transition that is
  // not in the table, most obviously. The alternative was to count the fault and
  // carry on into the requested phase, which leaves the world reporting a
  // definite answer it has no grounds for. Saying "I do not know" is worth more
  // than a confident wrong answer, and it is the one thing the old design could
  // not express.
  //
  // KEPT APART FROM `PHASE_IDLE` although both are "alive, nothing running":
  // the remedy differs. Idle means drag an app on. This means a firmware bug —
  // capture the log. Collapsing them would make a bug look like an empty badge.
  PHASE_FAULT = 6;

  // Up and answering, but unable to host ANY session on this boot.
  //
  // The heap is the case: instantiation needs 2911 KB and a world whose PSRAM
  // did not come up has 64 KB of SRAM, which is enough to report and not enough
  // to run. No payload will change that, so this is not idleness.
  //
  // WHY A THIRD STATE AND NOT A REASON ON `PHASE_IDLE`. Because the next action
  // differs, which is the whole test a state has to pass here: idle means supply
  // content, this means look at the hardware. A badge whose heap never came up
  // and which tells you to drag an app on is giving advice that cannot work.
  //
  // NOT A DEAD END EITHER. A client may still ask it to open a session — it will
  // almost certainly fail again, and that is the operator's call to make rather
  // than this firmware's to forbid.
  PHASE_DEGRADED = 7;
}

// A stage of the bring-up — one step WITHIN a `Phase`.
//
// AN ENUM, NOT THE ANNOUNCEMENT TEXT. `LogLine.stage` was a string carrying
// `"instantiate countdown"` — which meant a test asserting on a stage was
// matching prose that changes whenever somebody rewords a label, and no client
// could enumerate the stages that exist. The PARAMETER (which app, which method)
// stays in `text`, where a human reads it; the identity is here, where a machine
// does.
enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_CLOCKS = 1;
  STAGE_DATA_BUS = 2;
  STAGE_DISPLAY = 3;
  STAGE_PSRAM = 4;
  STAGE_PAYLOAD_REGION = 5;
  STAGE_VERIFY_PAYLOAD = 6;
  STAGE_INSTANTIATE = 7;
  STAGE_MANIFEST = 8;
  STAGE_EXECUTE = 9;
}


// A button on the world's own hardware (D3).
//
// THE WORLD'S BUTTONS, NOT AN APP'S ACTIONS. An app never learns that a press
// was injected rather than pressed, and cannot ask — driving a world must be
// indistinguishable from using it, or a test proves something about the test
// harness instead of about the app (D6).
//
// HOME IS ABSENT DELIBERATELY. On this board it is the BOOTSEL button, wired
// into the boot path rather than freely readable, so a value for it would be a
// promise the badge cannot keep. A verb that accepts a button it will silently
// ignore is worse than one that refuses.
enum Button {
  BUTTON_UNSPECIFIED = 0;
  BUTTON_A = 1;
  BUTTON_B = 2;
  BUTTON_C = 3;
  BUTTON_UP = 4;
  BUTTON_DOWN = 5;
}

message PressButtonRequest {
  Button button = 1;
}

// The panel's TEXT, not its pixels.
//
// A screenshot would be 153,600 bytes, would need a decoder to assert anything
// about, and would make a test fail when a colour changed. What a test actually
// wants to know is what the badge SAYS — so this is the character grid the world
// drew, reconstructed from the same draw calls that reached the panel.
message ScreenResponse {
  // One string per non-empty row, in top-to-bottom order, trailing spaces
  // trimmed. Column alignment is preserved WITHIN a row, because the badge's own
  // report format uses it — `6*  instantiate ...  OK` reads as three columns and
  // a test asserting on it should see the same.
  repeated string rows = 1;
  uint32 cols = 2;
  // The full height, including rows that were blank and so are not in `rows`.
  uint32 height = 3;
}


// Whether a payload's bytes still check out. Mirrors `catalog::Integrity`.
enum Integrity {
  INTEGRITY_UNSPECIFIED = 0;
  // Checksum present and correct.
  INTEGRITY_VERIFIED = 1;
  // No checksum recorded — an image built before the field existed.
  INTEGRITY_UNVERIFIED = 2;
  // Checksum present and WRONG: a half-finished drag, a bad write, a truncated
  // UF2.
  INTEGRITY_CORRUPT = 3;
  // Bytes intact, built against a DIFFERENT engine. Distinct from corrupt
  // because the remedy differs: one means reflash the file, the other means
  // rebuild it.
  INTEGRITY_WRONG_ENGINE = 4;
}

// One installed app, as the world sees it.
message PayloadInfo {
  // Position in the menu, and what `SelectPayloadRequest` names.
  uint32 index = 1;
  // A LABEL, so genuinely a string: an app is whatever somebody dragged onto
  // the payload region, and the world does not get to enumerate those.
  string name = 2;
  uint32 size = 3;
  Integrity integrity = 4;
  // Which command runs when this app is chosen. The app's own fact, carried
  // with the app.
  uint32 entry_method = 5;
  // Marked as the one to run unattended.
  bool is_default = 6;

  // Whether the world will actually run it.
  //
  // DERIVABLE FROM `integrity` AND SENT ANYWAY, because the derivation is the
  // WORLD'S POLICY, not arithmetic: today `WRONG_ENGINE` is refused exactly like
  // `CORRUPT`, and that could reasonably change. A client that recomputed this
  // would be asserting its own policy against a badge that had moved on.
  bool runnable = 7;
}

message ListPayloadsResponse {
  repeated PayloadInfo payloads = 1;
  // Which one the world last ran or is running.
  uint32 selected = 2;
}

// Choose the app the NEXT menu resolves to.
//
// A menu is only on screen between sessions, so this does not interrupt a
// running app — it is remembered and consumed when the menu next appears, which
// it then skips rather than waiting out its timeout.
//
// PRESSING BUTTONS WOULD ALSO WORK, and is worse for a test: `-press down` twice
// means "two down from wherever the highlight happens to be", so a test asserting
// on the result depends on the previous test's final position. An index does not.
message SelectPayloadRequest {
  uint32 index = 1;
}


// Run an app command, as though the world had collected the input itself (D2).
//
// # Why this is the verb the protocol most needed
//
// Everything else here asks about a WORLD. This one goes THROUGH it: the bytes
// are the app's own request, in the app's own schema, which the world cannot
// read and does not try to. That is why `ControlRequest.payload` is opaque bytes
// rather than a oneof — a typed envelope could not have expressed this.
//
// # It supersedes the widgets rather than racing them
//
// A world normally collects a command's input by putting a keyboard or a spinner
// on the panel. When a request arrives, that collection is pointless — the input
// is already here — so any widget waiting for a finger gives up and the turn runs
// with these bytes instead. Otherwise a test would have to press B on a spinner
// it did not want in order to deliver a request that replaces its value.
//
// # The reply comes LATE, and that is not a timeout
//
// The engine lives on the world's main flow and the control channel is answered
// from an interrupt, so this cannot be run where it is received. It is queued,
// picked up at the top of the next turn, and answered when the app returns —
// which is as long as the app takes. A caller's deadline has to cover the app's
// runtime, not the link's.
//
// ONE AT A TIME. A second request while one is outstanding is refused rather than
// queued: the protocol has no message ids yet, so a client matches a reply to its
// request by there being only one in flight. Queuing two would silently pair the
// wrong answer with the wrong question.
message ExecuteRequest {
  // Which command. The same id `PayloadInfo.entry_method` reports, and the same
  // one an app's generated dispatcher switches on.
  uint32 method_id = 1;
  // The app's request, encoded in the app's own schema.
  bytes request = 2;
}

message ExecuteResponse {
  // WHICH COMMAND THIS ANSWERS.
  //
  // Implicit until now: the caller sent a method id, so it knew. That holds
  // only while the response never leaves the conversation that produced it —
  // and the whole point of framing was that these bytes can be logged,
  // replayed, or mirrored to another world (D8), where "what did I ask for" is
  // no longer in scope. One varint makes the answer decodable on its own, which
  // is also what lets a reader pick the right response spec for it.
  uint32 method_id = 4;

  // WHETHER THE APP SUCCEEDED, which is not whether the world did.
  //
  // `ControlResponse.ok` says the world accepted the verb and ran something.
  // This says what that something reported. A world can flawlessly run an app
  // that fails, and collapsing the two would make "the badge could not run it"
  // indistinguishable from "it ran and said no".
  bool success = 1;
  // The app's response, in the app's own schema.
  bytes output = 2;
  // What the app said went wrong, if anything.
  string error = 3;
}

// Which tier is answering.
//
// # Why this is NOT in an app's manifest
//
// Not because an app already knows — it does not, and that is the whole reason
// the manifest exists. An app is ONE portable artifact: the same engine package
// is linked natively, compiled to wasm for a browser, and AOT-compiled to a
// `.cwasm` that a badge runs for apps it was never built for. At runtime it
// cannot tell which of those happened.
//
// (An earlier version of this comment said the opposite — "a tier is what an app
// was built for" — which inverts the central premise of the architecture. It is
// recorded here because a schema comment is read as settled fact, and this one
// was wrong for a day.)
//
// The real reason is REDUNDANCY. `World` already determines the tier:
// `badge-normal` is rp2350, `browser` is the browser tier, `native` is native.
// Carrying both in the same message makes a disagreement EXPRESSIBLE — a world
// that reports `browser` and `rp2350` together — and this schema has spent its
// life removing exactly that shape: `TextOut.availability` beside `outlet`, the
// `config` map beside typed fields.
//
// So an app is told the more specific of the two, once.
enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_RP2350 = 1;
  TIER_BROWSER = 2;
  TIER_NATIVE = 3;
  TIER_QEMU_ARMV7M = 4;
}

// The envelope every control exchange uses.
//
// A VERB AND OPAQUE BYTES, rather than a oneof per request type. Two reasons,
// and the second is the load-bearing one:
//
//   - a `no_std` world hand-decodes this, and a varint plus a length-delimited
//     field is a few lines where a oneof is a dispatch table;
//   - PASS-THROUGH (D2) carries an app's own request bytes, which have no schema
//     the world knows. An envelope that insisted on typed payloads could not
//     express the verb this protocol most needs.
message ControlRequest {
  Verb verb = 1;
  // The verb's argument, if it takes one. For `VERB_EXECUTE` this is a
  // `method_id` and the app's request bytes; for `VERB_GET_WORLD_STATE`, empty.
  bytes payload = 2;

  // A NUMBER THE CLIENT CHOOSES, echoed on the reply.
  //
  // # Why this exists before anything needs it
  //
  // Today a client pairs a reply with its request by there being only one in
  // flight — `passthrough.rs` REFUSES a second pass-through for exactly that
  // reason, and says so. That is not a design, it is the absence of one, and it
  // holds only while three things stay true: one client, one link, and a
  // transport that neither reorders nor duplicates.
  //
  // Each of those is already scheduled to stop being true. The browser mirror
  // (D8) is a second client on the same wire. A UDP transport (D9 §1a) can
  // deliver a reply twice, or out of order, or after the retry that replaced
  // it — and an uncorrelated reply is then not merely unhelpful, it is WRONG,
  // and wrong in a way nothing can detect after the fact.
  //
  // Adding it now costs a varint. Adding it later means every client that
  // learned to depend on one-at-a-time is a client that breaks.
  //
  // # It is opaque to the world
  //
  // A world never interprets it, never validates it, and never remembers it
  // beyond the reply it is echoing into. Zero means "not correlated", which is
  // what a client that predates this field sends, and it keeps working.
  uint64 request_id = 3;
}

message ControlResponse {
  // False means the world refused or could not answer. `error` says why, in
  // words meant for a person reading a test failure.
  bool ok = 1;
  string error = 2;
  // The verb's answer, encoded per verb. `VERB_GET_WORLD_STATE` returns an
  // encoded `WorldState`.
  bytes payload = 3;

  // The `request_id` of the request this answers, copied verbatim.
  //
  // A client that sent one and receives a reply carrying a DIFFERENT id has
  // learned something true and useful: this is not its answer. Skipping it and
  // continuing to wait is correct, and is what makes a late reply from a
  // timed-out request harmless rather than a wrong answer to the next question.
  uint64 request_id = 4;
}

// A line of a world's log, as a message rather than a string (D8b).
//
// The world still emits human-readable TEXT on the same wire, always, including
// in builds with no control channel — a last-resort diagnostic that needs a
// decoder is a weaker last resort. This is the machine-readable half, for a test
// asserting on a stage rather than grepping prose, and for a browser world
// rendering a live badge (D8).
message LogLine {
  // Milliseconds since boot, so a reader can see pacing without timestamping the
  // moment it happened to read — which is how a countdown was once measured at
  // 0 ms.
  uint64 uptime_ms = 1;

  // The stage this belongs to, if any. `STAGE_UNSPECIFIED` for a free-standing
  // note. See `Stage` for why this stopped being the announcement text.
  Stage stage = 2;

  // What happened.
  Level level = 3;

  // The human-readable text, identical to what the text stream carried. Kept so
  // a frame reader never has LESS than a terminal would have shown.
  string text = 4;

  // Whether this stage tells us anything the emulator could not have.
  //
  // Load-bearing, not decoration. The badge runs checks that QEMU also runs and
  // checks only silicon can answer, and the second kind is the reason to plug a
  // board in at all. A run where every hardware-only stage passes and an
  // emulated one fails means the board and the emulator DISAGREE — a far more
  // interesting result than a loose wire, and one a reader cannot reach for
  // without this field.
  Scope scope = 5;
}

enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_STAGE_OK = 1;
  LEVEL_STAGE_FAIL = 2;
  // Detail under a stage.
  LEVEL_NOTE = 3;
  // A stage ANNOUNCED and not yet resolved.
  //
  // THE STATE THAT MATTERS WHEN A WORLD HANGS, and it was missing. The enum
  // above once carried a comment claiming "did not resolve" was a third state
  // and the reason this was not a bool — while having no value for it. So the
  // one case the field was reasoned about was the one case it could not express.
  //
  // It is worse than a gap on this tier, because of how a stage is WRITTEN: the
  // world emits `6. instantiate countdown ... ` with no newline and closes the
  // line with the result. A frame stream built on completed lines therefore said
  // NOTHING AT ALL about a stage that hung — a reader saw five stages and
  // silence, and could locate the hang only as "after 5", never by name.
  //
  // Emitted when the stage opens, so a client learns the name before the thing
  // that might not finish is attempted.
  LEVEL_STAGE_OPEN = 4;
}

// Whether a check could have been run anywhere, or only on the board.
//
// Mirrors `report::Scope` in the badge firmware, which is where the distinction
// is enforced; this carries it to a reader that is not looking at the panel.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  // Only the board can answer: PSRAM and its XIP-disabled init, the ST7789 on a
  // bit-banged bus, flash-mapped payloads, the crystal, a Cortex-M33.
  SCOPE_HARDWARE_ONLY = 1;
  // Already proven green under `make qemu`. A failure here is not "does it
  // work" but "does the BOARD disagree with the emulator".
  SCOPE_EMULATED = 2;
}

// The verbs. Numbered permanently: a caller and a world may be built from
// different revisions, and a renumbered verb would silently mean something else.
enum Verb {
  VERB_UNSPECIFIED = 0;
  // What are you and what are you doing. Phase 1.
  VERB_GET_WORLD_STATE = 1;
  // Reserved, in the order the plan builds them. Declared rather than
  // commented so the numbers are claimed before two branches claim the same one.
  VERB_EXECUTE = 2;      // pass-through to the app (D2)
  VERB_PRESS_BUTTON = 3; // drive the menu, keyboard, spinner
  VERB_GET_SCREEN = 4;   // the panel's text, not its pixels
  VERB_LIST_PAYLOADS = 5;
  VERB_SELECT_PAYLOAD = 6;
  VERB_REBOOT = 7;
  // Ask to be sent notices. Payload is a `Subscription`; the reply echoes the
  // set actually granted.
  VERB_SUBSCRIBE = 8;
}

// What a client wants pushed to it (D8c).
//
// # Why a world is silent until asked
//
// The first attempt at framed logging emitted a `LogLine` for every line the
// world wrote. That filled the outbound queue permanently, so the reply path
// short-circuited on every service call and the TEXT log — the last-resort
// diagnostic, the one that needs no tooling — was never transmitted at all. The
// framing was right; pushing it at nobody was not.
//
// So notices cost nothing until a client asks, and a badge with no client on the
// cable behaves exactly as it did before this existed.
//
// # Silence is about FRAMES, and subscribing is retroactive
//
// The world is never actually mute. It writes human-readable text to the same
// wire unconditionally — including in builds compiled without this channel — and
// it replays that text once when a host opens the port. Nothing that happens
// before a client arrives is lost to someone holding a terminal.
//
// Frames would have had that gap, and a bring-up fails EARLY: the interesting
// ten seconds are usually the ten before any tool has connected. So subscribing
// to `NOTICE_LOG` does not mean "send me what happens next", it means "send me
// the log", starting from the beginning of the run the world still has buffered.
// A client that attaches late gets the failure it attached because of.
//
// The limit is the log buffer, not the subscription: once a run overflows it the
// oldest lines are gone, and the world says so rather than quietly starting
// mid-story. What no channel can carry is a fault that kills the board before
// USB enumerates — that is what the screen and the UART are for.
//
// # Why the whole set, rather than add/remove
//
// This message declares what the subscription IS, not how it should change.
// Subscribing twice therefore means the same thing as subscribing once, a
// reconnecting client does not have to remember what it asked for last time, and
// an empty set is a well-formed unsubscribe rather than a special verb.
//
// Add/remove would need the client and the world to agree about state that only
// one of them can see, and they disagree the moment a badge reboots — which,
// with a reset button on the front, it does constantly.
message Subscription {
  // How often to beat, for `NOTICE_HEARTBEAT`. Zero takes the world's own
  // default.
  //
  // THE SUBSCRIBER CHOOSES, because the subscriber is the one who knows what it
  // is watching for: a person watching a badge wants a second, a test watching
  // for a hang in a ten-minute run does not. A world that fixed the rate would
  // be guessing at both.
  //
  // A WORLD MAY STILL REFUSE THE NUMBER. It is clamped to what this world will
  // actually sustain and the granted value comes back in the reply — asking for
  // a beat every millisecond on a link that also carries a log is a request to
  // starve the log, and quietly obeying would be worse than saying no.
  uint32 heartbeat_ms = 2;

  // The notices wanted. EMPTY MEANS NONE, which is how a client unsubscribes.
  //
  // A world grants what it supports and no more, and the reply says which — so a
  // client built against a newer proto learns that it will not be getting
  // something rather than waiting for it.
  repeated Notice notices = 1;
}

// Frames a world sends WITHOUT being asked (D8).
//
// Everything above is request/response. A notification has no request to answer,
// so it carries its own kind — and a reader that does not recognise one skips it
// by wire type rather than desynchronising, which is what lets a world add
// notifications a reader predates.
enum Notice {
  NOTICE_UNSPECIFIED = 0;
  // A `LogLine`.
  NOTICE_LOG = 1;

  // A periodic `WorldState`, so that SILENCE MEANS SOMETHING.
  //
  // Every other diagnostic here is "the world says things". None of them says
  // "the world is still here", so silence had four readings — hung, finished,
  // starved, or a reader already at the end — and no way to tell them apart
  // without reflashing. That ambiguity cost an hour on 2026-08-17.
  //
  // A beat collapses it. If it stops, the world stopped. If it continues while
  // nothing else arrives, the world is alive and the silence is about something
  // else. That is a different claim from anything the log makes, and it is the
  // one that was missing.
  NOTICE_HEARTBEAT = 2;
}
