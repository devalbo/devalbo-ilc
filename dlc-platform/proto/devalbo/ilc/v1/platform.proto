syntax = "proto3";

package devalbo.ilc.v1;

option go_package = "github.com/devalbo/dlc-platform/gen/go/devalbo/ilc/v1;ilcv1";

import "devalbo/options/v1/options.proto";

// The ILC platform's own command surface — the verbs EVERY app inherits rather
// than writes (§16.3). Apps depend on these; they never inline them, so a fix
// here (path containment, bundle parsing) reaches every app on a version bump
// instead of being frozen into whatever `dlc new` copied that day (§16.6).
//
// METHOD ID RANGES — permanent, and the reason this file exists separately:
//
//	     1 –  9999   ILC — the whole framework's surface, reserved entirely
//	 10000 +         THE APP's own commands
//
// The ILC band is subdivided by capability, mirroring §6:
//
//	     1 –    99   core lifecycle (version; later describe, supported-abis)
//	   100 –   199   filesystem     (export/import/reset; later read/write/delete/list)
//	   200 –   299   index (SQLite)
//	   300 –   399   events
//	   400 –   499   display
//	   500 –   599   network
//	   600 –  9999   reserved for future ILC capabilities
//
// One capability per block, mirroring §6, so a new capability lands in its own
// block instead of being wedged into the next free number — and an id's
// magnitude tells you what it is when you are reading a wire trace.
//
// Dispatch is one flat `map[uint32]handler` across both bands, so the boundary
// is what keeps an app from colliding with a capability ILC adds later. 9999 is
// deliberately far more than the framework will need: `method_id` is a u32, so
// over-reserving costs nothing, while WIDENING the band after apps exist would
// break every app id above it. `buf breaking` plus
// protoc-gen-dlc-registry's id-lock guard the numbers once assigned.
service PlatformService {
  // --- core lifecycle block (1–99) ---
  // Every app wants a version command; the string itself is app-supplied.
  rpc Version(VersionRequest) returns (VersionResponse) {
    option (devalbo.options.v1.method_id) = 1;
  }
  // The host stating what this host can actually do (Decision 32, §6.4a). Sent
  // once at launch BEFORE any other command, and re-sent whenever a fact
  // changes. Also the trigger for registering capability-dependent verbs, which
  // is why it lives in the block that is always registered.
  rpc SetEnvironment(SetEnvironmentRequest) returns (SetEnvironmentResponse) {
    option (devalbo.options.v1.method_id) = 2;
    // A host sends this; nobody types it. See cli_hidden.
    option (devalbo.options.v1.cli_hidden) = true;
  }
  // What is registered RIGHT NOW — which is not what the schema says, once
  // capability verbs register from the manifest (plan D7).
  //
  // Two callers, and they want the same answer for different reasons. A host
  // marks a command unavailable instead of letting it fail as `unknown
  // method_id`. And PARITY compares the surface itself: registration is
  // invisible to a check that only compares results, so two tiers can offer
  // different commands with every existing check green — twice demonstrated
  // while building phase 2.
  rpc GetCommandSurface(GetCommandSurfaceRequest) returns (GetCommandSurfaceResponse) {
    option (devalbo.options.v1.method_id) = 4;
    // Introspection plumbing: hosts call it, people do not type it.
    option (devalbo.options.v1.cli_hidden) = true;
  }
  // Held for commands that are designed but unbuilt. Declared, not commented —
  // the generator refuses any rpc that claims one, and the id lock records them.
  //   3 = SupportedAbis   (Decision 31) the guest advertising ITS boundaries —
  //                       the opposite direction to the manifest
  option (devalbo.options.v1.reserved_method_id) = 3;
  // --- filesystem block (100–199) ---
  // Bundle a subtree into one portable blob
  rpc ExportFs(ExportFsRequest) returns (ExportFsResponse) {
    option (devalbo.options.v1.method_id) = 100;
  }
  // Write a bundle back into the filesystem
  rpc ImportFs(ImportFsRequest) returns (ImportFsResponse) {
    option (devalbo.options.v1.method_id) = 101;
  }
  // Delete everything under a prefix
  rpc ResetFs(ResetFsRequest) returns (ResetFsResponse) {
    option (devalbo.options.v1.method_id) = 102;
  }
}

message VersionRequest {}
message VersionResponse {
  string version = 1;
}

// ---- the environment manifest (§6.4a, Decision 32) ------------------------

// Whether a capability is there.
//
// Three states rather than a bool, because UNSPECIFIED is not ABSENT: the first
// means nobody said, the second means somebody said no. They happen to lead to
// the same conservative behaviour (an app takes its fallback path either way),
// but conflating them would make "the host forgot to send a manifest"
// indistinguishable from "this host has no filesystem" — and only one of those
// is a bug worth surfacing.
enum Availability {
  AVAILABILITY_UNSPECIFIED = 0; // nobody said; treated as absent
  AVAILABILITY_ABSENT = 1;
  AVAILABILITY_PRESENT = 2;
}

// What KIND of root the host granted. Not cosmetic: an app deciding what to
// cache cares whether its store survives the tab closing.
enum FilesystemKind {
  FILESYSTEM_KIND_UNSPECIFIED = 0;
  FILESYSTEM_KIND_CWD = 1;      // the user's project — `dlc` itself (§3·5)
  FILESYSTEM_KIND_APP_DIR = 2;  // ./.<app>/ — the convention for everyone else
  FILESYSTEM_KIND_OPFS = 3;     // the browser's origin-private filesystem
}

// Whether this root belongs to ONE person, or is shared with others.
//
// Separate from FilesystemKind rather than a fourth value of it, because it is
// an orthogonal dimension: `kind` already mixes WHERE the root is (cwd, app dir)
// with WHAT backs it (OPFS), and a per-user OPFS subtree is genuinely both OPFS
// and per-user. An enum can only say one thing.
//
// Three states for the same reason Availability has three: "nobody said" is not
// "somebody said it is shared", and only the second is a claim.
enum Isolation {
  ISOLATION_UNSPECIFIED = 0; // nobody said; treated as SHARED
  ISOLATION_SHARED = 1;      // other people may see this store
  ISOLATION_PER_USER = 2;    // this root was granted for one person
}

message Filesystem {
  Availability availability = 1;
  FilesystemKind kind = 2;
  // Ephemeral means the store does not survive the process/tab. An app may
  // still write; it should not promise the user durability.
  bool ephemeral = 3;

  // Whether the host isolated this store per user (§3·5).
  //
  // WHO READS THIS, since no app in this repo does yet: an app that holds
  // PRIVATE data and needs to know whether privacy is its problem. If the host
  // granted a per-user root, everything the app can see belongs to one person
  // and it may be naive. If it did not, the app is responsible for access
  // control, and an app that assumed otherwise leaks — silently, and only
  // discoverably by leaking.
  //
  // That asymmetry is why this field exists ahead of its first consumer, where
  // ENVIRONMENT-PLAN.md D6 would normally say to wait: an unused field costs one
  // field, and a missing one costs someone else's data.
  //
  // UNSPECIFIED IS SAFE, which is what makes it addable without touching a
  // single existing host: no claim reads as "not isolated", so an app that
  // requires privacy refuses to run rather than assuming it has it. A host that
  // forgets to declare isolation therefore fails LOUDLY instead of leaking.
  //
  // NOT A SECURITY BOUNDARY. This is the host's word. A host that grants a
  // shared root and reports PER_USER is lying, and nothing engine-side can
  // detect it — see AGENTS.md §3·5. It lets an honest host tell an app what it
  // is getting; it does not enforce anything.
  Isolation isolation = 4;
}

// Environment is what the host can do, as of `revision`.
//
// Deliberately small (plan D6): a field here is a branch somewhere, and a
// capability nothing reads yet is a branch nothing tests. Display may never land
// at all now that Decision 34 made the semantic render path the default. Events
// are absent BY RULE, not by omission — emitting carries nothing back, so its
// absence is unobservable and Decision 33 forbids an app branching on it.
message Environment {
  // Monotonic, host-assigned, and REQUIRED to be non-zero — the engine rejects
  // 0 rather than reading it as "the first one", so a host that forgot cannot
  // masquerade as a host that is up to date.
  //
  // Its reader is registration: SetEnvironment re-runs capability registration
  // and churns the command surface, so an unchanged revision is how the engine
  // knows to do nothing. A slot can also tell whether what it rendered from is
  // still current.
  uint32 revision = 1;
  Filesystem filesystem = 2;

  // 3 held an `Index { availability }` for one afternoon, when the derived index
  // was going to be a host-provided SQLite database that a tier could lack. It
  // is not: the index is a projection the engine owns, present wherever a
  // filesystem is, so there is nothing for a manifest to report
  // (docs/INDEX-PLAN.md D8).
  //
  // Reserved rather than reused, because the field a host store would eventually
  // want is a DIFFERENT question — "does this host provide a key-value store"
  // (that plan's Phase 6) — and giving an old number new semantics is how a
  // stale decoder silently reads the wrong fact.
  reserved 3;
  reserved "index";
}

message GetCommandSurfaceRequest {}
message GetCommandSurfaceResponse {
  // Every registered method_id, ASCENDING. Sorted because map iteration order
  // is unspecified in Go, and an unsorted answer would make the parity diff
  // fail at random — a flake that would read as a real divergence.
  //
  // Ids rather than names: the id is the wire and the name is cosmetic
  // (AGENTS.md §3b), and the caller already has the names — it holds the
  // generated clispec and is asking which of those are live.
  repeated uint32 method_ids = 1;
}

message SetEnvironmentRequest {
  Environment environment = 1;
}
message SetEnvironmentResponse {
  // Whether this manifest actually changed anything. False means the revision
  // matched what was already in force and registration was left alone.
  bool applied = 1;
}

// Filesystem export/import — the first-class platform primitive (§7.3). An
// app's whole state is a filesystem tree, so one bundle moves it between the
// terminal, the browser, and an embedded device.
enum BundleFormat {
  BUNDLE_FORMAT_UNSPECIFIED = 0; // treat as BFT (the default)
  BUNDLE_FORMAT_BFT = 1;         // single human-readable JSON
  BUNDLE_FORMAT_ZIP = 2;
  BUNDLE_FORMAT_PROTO = 3;
}

// How an import treats what is already on disk. Explicit because the default
// (merge) silently cannot express a deletion: dropping a file from a bundle and
// re-importing leaves the old file in place.
enum ImportMode {
  IMPORT_MODE_UNSPECIFIED = 0; // treat as MERGE
  IMPORT_MODE_MERGE = 1;       // write the bundle over whatever is there
  IMPORT_MODE_REPLACE = 2;     // clear the destination first, then write
}

message ExportFsRequest {
  string prefix = 1 [
    (devalbo.options.v1.help) = "subtree to export (default: whole root)",
    (devalbo.options.v1.short) = "p"
  ];
  BundleFormat format = 2 [
    (devalbo.options.v1.help) = "bundle format",
    (devalbo.options.v1.default) = "BUNDLE_FORMAT_BFT",
    (devalbo.options.v1.short) = "f"
  ];
}
message ExportFsResponse {
  bytes bundle = 1;
}

message ImportFsRequest {
  bytes bundle = 1 [
    (devalbo.options.v1.help) = "bundle bytes to import",
    (devalbo.options.v1.required) = true,
    // A path, or `-` for stdin. Positional so `import-fs backup.json` reads
    // the way it always has.
    (devalbo.options.v1.cli_positional) = 1
  ];
  string prefix = 2 [
    (devalbo.options.v1.help) = "destination subtree",
    (devalbo.options.v1.short) = "p"
  ];
  ImportMode mode = 3 [
    (devalbo.options.v1.help) = "merge into the destination, or replace it",
    (devalbo.options.v1.default) = "IMPORT_MODE_MERGE"
  ];
}
message ImportFsResponse {
  repeated string files = 1;
}

// reset-fs — delete a subtree (§7.3). The counterpart that makes "replace"
// expressible on its own, and the only way to re-scaffold over an existing tree.
message ResetFsRequest {
  string prefix = 1 [
    (devalbo.options.v1.help) = "subtree to delete (default: whole root)",
    (devalbo.options.v1.short) = "p"
  ];
}
message ResetFsResponse {
  repeated string removed = 1; // top-level entries that were deleted
}

// ---- events (§6.3) --------------------------------------------------------

// DataChangedEvent is the payload of the platform's `ilc.data-changed` topic:
// "the filesystem under this prefix changed, re-read what you care about".
//
// Deliberately NOT a diff. A precise change list would be a second source of
// truth that a subscriber could act on WITHOUT re-reading the files — and the
// files are the truth (§7.1). Telling a UI only that something moved keeps the
// filesystem authoritative and keeps this message from growing into a protocol.
// EnvironmentChangedEvent announces that the facts moved (§6.4a).
//
// Emitted only when a manifest actually APPLIES — a re-send of the revision
// already in force changes nothing, and announcing it would have every listener
// re-read for no reason.
//
// Why an event and not a return value: the host that sent the manifest already
// knows. This is for everyone ELSE — a command inspector showing which verbs
// this host provides, a slot rendering a capability-dependent control. They did
// not make the call and have no other way to learn the answer changed.
//
// Carries the revision and nothing else, for the same reason DataChangedEvent
// is not a diff: a listener that acted on the payload would be treating the
// event as the source of truth instead of re-reading. Ask the engine.
message EnvironmentChangedEvent {
  option (devalbo.options.v1.topic) = "ilc.environment-changed";

  // The revision now in force. Enough for a listener to tell whether it has
  // already caught up, and useless for anything else — deliberately.
  uint32 revision = 1;
}

message DataChangedEvent {
  option (devalbo.options.v1.topic) = "ilc.data-changed";

  // Root-relative subtree that changed. Empty means the whole root.
  string prefix = 1;
  // The command that caused it, as a method_id — enough for a subscriber to
  // ignore its own writes without the platform having to model identity.
  uint32 method = 2;
}
