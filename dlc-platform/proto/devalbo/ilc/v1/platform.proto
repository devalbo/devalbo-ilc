syntax = "proto3";

package devalbo.ilc.v1;

option go_package = "github.com/devalbo/devalbo-ilc/dlc-platform/gen/go/devalbo/ilc/v1;ilcv1";

import "devalbo/options/v1/options.proto";

// For `SetWorldManifest`'s request and reply. WHAT A WORLD IS lives in its own
// file — this one is the command surface, the bundle format and the index, and
// it only needs the manifest to name the rpc that delivers it.
import "devalbo/ilc/v1/world_manifest.proto";

// The ILC platform's own command surface — the verbs EVERY app inherits rather
// than writes (§16.3). Apps depend on these; they never inline them, so a fix
// here (path containment, bundle parsing) reaches every app on a version bump
// instead of being frozen into whatever `dlc new` copied that day (§16.6).
//
// METHOD ID RANGES — permanent, and the reason this file exists separately:
//
//	     1 –  9999   ILC — the whole framework's surface, reserved entirely
//	 10000 +         THE APP's own commands
//
// The ILC band is subdivided by capability, mirroring §6:
//
//	     1 –    99   core lifecycle (version; later describe, supported-abis)
//	   100 –   199   filesystem     (export/import/reset; later read/write/delete/list)
//	   200 –   299   index (a projection the ENGINE owns — not SQLite; INDEX-PLAN.md §0)
//	   300 –   399   events
//	   400 –   499   display
//	   500 –   599   network
//	   600 –  9999   reserved for future ILC capabilities
//
// One capability per block, mirroring §6, so a new capability lands in its own
// block instead of being wedged into the next free number — and an id's
// magnitude tells you what it is when you are reading a wire trace.
//
// Dispatch is one flat `map[uint32]handler` across both bands, so the boundary
// is what keeps an app from colliding with a capability ILC adds later. 9999 is
// deliberately far more than the framework will need: `method_id` is a u32, so
// over-reserving costs nothing, while WIDENING the band after apps exist would
// break every app id above it. `buf breaking` plus
// protoc-gen-dlc-registry's id-lock guard the numbers once assigned.
service PlatformService {
  // --- core lifecycle block (1–99) ---
  // Every app wants a version command; the string itself is app-supplied.
  rpc Version(VersionRequest) returns (VersionResponse) {
    option (devalbo.options.v1.method_id) = 1;
  }
  // The host stating what this host can actually do (Decision 32, §6.4a). Sent
  // once at launch BEFORE any other command, and re-sent whenever a fact
  // changes. Also the trigger for registering capability-dependent verbs, which
  // is why it lives in the block that is always registered.
  rpc SetWorldManifest(SetWorldManifestRequest) returns (SetWorldManifestResponse) {
    option (devalbo.options.v1.method_id) = 2;
    // A host sends this; nobody types it. See cli_hidden.
    option (devalbo.options.v1.cli_hidden) = true;
  }
  // What is registered RIGHT NOW — which is not what the schema says, once
  // capability verbs register from the manifest (plan D7).
  //
  // Two callers, and they want the same answer for different reasons. A host
  // marks a command unavailable instead of letting it fail as `unknown
  // method_id`. And PARITY compares the surface itself: registration is
  // invisible to a check that only compares results, so two tiers can offer
  // different commands with every existing check green — twice demonstrated
  // while building phase 2.
  rpc GetCommandSurface(GetCommandSurfaceRequest) returns (GetCommandSurfaceResponse) {
    option (devalbo.options.v1.method_id) = 4;
    // Introspection plumbing: hosts call it, people do not type it.
    option (devalbo.options.v1.cli_hidden) = true;
  }
  // What each command TAKES — the input surface, as data.
  //
  // `GetCommandSurface` says which methods exist; this says what they accept.
  // Both are things only the engine knows, and both exist because a host that
  // guessed would guess differently on every tier.
  //
  // WHO NEEDS IT. The CLI does not — it compiles the same description in, and
  // that is the point of comparison (a test asserts the two agree). It is for
  // hosts that CANNOT compile an app's schema in: a badge running payloads it
  // was never built for, and a browser that would otherwise hand-write an
  // `<input>` per field and watch it rot when the field is renamed.
  //
  // Field NUMBER and kind are what a generic host needs, and they are enough:
  // encoding a string into field 1 is a tag and a length, so a loader can build
  // a request for an app whose schema it has never seen. Rendering a RESPONSE
  // still needs the schema and is deliberately not solved here.
  rpc GetCommandSpec(GetCommandSpecRequest) returns (GetCommandSpecResponse) {
    option (devalbo.options.v1.method_id) = 5;
    // Introspection plumbing: hosts call it, people do not type it.
    option (devalbo.options.v1.cli_hidden) = true;
  }
  // WHAT THE APP'S MESSAGES LOOK LIKE — the other half of `GetCommandSpec`.
  //
  // That verb describes REQUEST fields, which is enough to build a request for
  // an app a host has never seen. It says so itself: "rendering a RESPONSE still
  // needs the schema and is deliberately not solved here." This is that.
  //
  // NEXT TO IT IN THE LIFECYCLE BLOCK because it answers the same kind of
  // question — what am I — and because a client that asks one usually wants
  // both.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse) {
    option (devalbo.options.v1.method_id) = 6;
    // Introspection plumbing: hosts call it, people do not type it.
    option (devalbo.options.v1.cli_hidden) = true;
  }
  // Held for commands that are designed but unbuilt. Declared, not commented —
  // the generator refuses any rpc that claims one, and the id lock records them.
  //   3 = SupportedAbis   (Decision 31) the guest advertising ITS boundaries —
  //                       the opposite direction to the manifest
  option (devalbo.options.v1.reserved_method_id) = 3;
  // --- filesystem block (100–199) ---
  // Bundle a subtree into one portable blob
  rpc ExportFs(ExportFsRequest) returns (ExportFsResponse) {
    option (devalbo.options.v1.method_id) = 100;
  }
  // Write a bundle back into the filesystem
  rpc ImportFs(ImportFsRequest) returns (ImportFsResponse) {
    option (devalbo.options.v1.method_id) = 101;
  }
  // Delete everything under a prefix
  rpc ResetFs(ResetFsRequest) returns (ResetFsResponse) {
    option (devalbo.options.v1.method_id) = 102;
  }
  // --- index block (200–299) ---
  // Rebuild the derived index by scanning the files it projects.
  //
  // The PLATFORM owns this verb and the APP owns the knowledge — only the app
  // knows its records live under `records/` and what is worth projecting, so the
  // work itself comes from SetIndexRebuilder (the same split as SetVersion).
  //
  // It is also the correctness anchor (INDEX-PLAN.md D4): the maintained index
  // must equal a rebuilt one, which is what catches a create that forgot to
  // index or a delete that left a row behind. Registered only when an app has
  // actually supplied a rebuilder — an app with no collection to project (dlc
  // itself) does not get a verb that could only fail.
  rpc RebuildIndex(RebuildIndexRequest) returns (RebuildIndexResponse) {
    option (devalbo.options.v1.method_id) = 200;
  }
}

message VersionRequest {}
message VersionResponse {
  string version = 1;
}

// ---- the command spec (WORLD-INPUT-PLAN.md D2) -----------------------------

// Where a flag's value comes from, as opposed to what type it is.
//
// Mirrors `devalbo.options.v1.CliSource` and `clispec.Source`. Kept separate
// from `kind` because they vary independently: a `bytes` field is almost always
// a file, but a long `string` may equally well be piped in, and a host must not
// have to guess which.
//
// STDIN IS THE ONE THAT TRAVELS FURTHEST. On a terminal it means a pipe; in a
// browser a text area; on a badge it is what makes the on-screen keyboard
// appear. The app declares "this value is typed by a person" once, and each
// world answers it with what it has.
enum SpecSource {
  SPEC_SOURCE_UNSPECIFIED = 0; // literal — the argument is the value
  SPEC_SOURCE_LITERAL = 1;
  SPEC_SOURCE_FILE = 2;
  SPEC_SOURCE_STDIN = 3;
}

// A flag's wire type — what a host needs to parse a value and encode the field.
//
// Mirrors `clispec.Kind`. A host that meets a kind it cannot render skips the
// field and the app takes its default, which is a no-op rather than an error
// (Decision 33).
// `StatusLevel` MOVED to devalbo/dlc/v1/status.proto.
//
// It was declared here, which put an APP-FACING vocabulary in the host-facing
// package: an app cannot import `devalbo.ilc.v1` — it vendors only what the
// scaffold gives it — so the one enum apps most needed was the one they could
// not reach, and `hello` declared its own instead. That is what this file being
// the wrong home actually cost.

enum SpecKind {
  SPEC_KIND_UNSPECIFIED = 0;
  SPEC_KIND_STRING = 1;
  SPEC_KIND_BOOL = 2;
  SPEC_KIND_INT32 = 3;
  SPEC_KIND_INT64 = 4;
  SPEC_KIND_UINT32 = 5;
  SPEC_KIND_UINT64 = 6;
  SPEC_KIND_ENUM = 7;
  SPEC_KIND_BYTES = 8;
}

// One field of a request message, as an input a host can collect.
message SpecFlag {
  // The kebab-cased field name. Cosmetic — `field` is the wire.
  string name = 1;
  // The proto field NUMBER. A host encodes by number, never by name, for the
  // same reason dispatch keys on method_id.
  uint32 field = 2;
  SpecKind kind = 3;
  SpecSource source = 4;
  string help = 5;
  bool required = 6;
  // In string form, parsed by the host to the field's wire type.
  string default_value = 7;
  bool repeated = 8;
  // 1-based argument position, or 0 for flag-only.
  uint32 positional = 9;
  // The permitted names for an enum flag — and the MENU a richer host shows.
  // The one place an app already declares its own choices.
  repeated string enum_values = 10;

  // The WIRE NUMBER of each name above, in the same order.
  //
  // AN ORDINAL IS NOT A VALUE, and this field exists because that was assumed.
  // A host encoding `op=multiply` by taking multiply's INDEX in `enum_values`
  // is right only for an enum numbered densely from zero; `UNSPECIFIED = 0;
  // OK = 1; FAILED = 5;` encodes FAILED as 2 and the app reads OK. Both are
  // legal values, so nothing rejects it — the app simply does the wrong thing
  // and reports success.
  //
  // PARALLEL TO `enum_values` rather than replacing it with pairs, because the
  // names alone are what a CLI prints and a menu shows, and every existing
  // reader wants exactly that. The two are emitted from ONE loop over the
  // enum's descriptor, so they cannot fall out of step: an index valid in one
  // is valid in the other by construction.
  repeated int32 enum_numbers = 12;
  // Single-letter alias. CLI-shaped, carried because dropping it would make
  // this description lossy against the one the CLI compiles in.
  string short = 11;
}

// One rpc, as a command a host can offer.
// One field of a command's RESPONSE.
//
// # Why this is not a `SpecFlag`
//
// A flag describes how a PERSON SUPPLIES a value: it has a source (a flag, an
// argument, stdin), a default, a short letter, a position on a command line, and
// a required bit. None of that means anything about something the app hands
// back, and reusing `SpecFlag` would ship five meaningless fields per result and
// invite the question "what does `required` mean on an output?"
//
// What the two share is the part that describes the VALUE, and that is exactly
// what is here.
//
// # What it is for
//
// Before this, a host could encode a request by name and could only count the
// bytes that came back:
//
//     -set from=3 -set style=words     ->  by name, type-checked, good errors
//     output                           ->  0a076c6966746f6666
//
// Those bytes are `field 1, string, "liftoff"`. The SHAPE is recoverable from
// the wire format alone; the NAME is not, and "field 1" is not a thing to show a
// person. This is the other half of the round trip.
message SpecResult {
  string name = 1;
  // The proto field NUMBER. A host decodes by number, never by name.
  uint32 field = 2;
  SpecKind kind = 3;
  bool repeated = 4;
  string help = 5;
  // For an enum result: the names, and the wire number of each.
  //
  // READ THE OTHER WAY from a flag's. On the way in a host maps a name to a
  // number; on the way out it maps a number to a name, so a field prints
  // `LIFTOFF` rather than `3`. Same pairs, opposite direction — which is why
  // they are one list and not two ideas.
  repeated string enum_values = 6;
  repeated int32 enum_numbers = 7;
}

message SpecCommand {
  string name = 1;
  uint32 method = 2;
  string summary = 3;
  repeated SpecFlag flags = 4;
  // Request message name, for diagnostics only.
  string request = 5;
  // A verb the HOST handles rather than the engine (Decision 30).
  bool local = 6;
  // Request fields this description cannot express — nested messages, maps,
  // repeated non-scalars. LISTED rather than dropped: a command that silently
  // ignores a field is worse than one that says it cannot set it.
  repeated string unsupported = 7;

  // What the command ANSWERS with.
  repeated SpecResult results = 8;
  // Response message name, for diagnostics only — the twin of `request`.
  string response = 9;
  // Response fields this description cannot express. Same rule as `unsupported`:
  // a renderer that silently omits a field is worse than one that says it cannot
  // show it, because the reader cannot tell an absent value from an unshowable
  // one.
  repeated string response_unsupported = 10;
}

message GetCommandSpecRequest {
  // Zero means EVERY command. A badge asks for one; a browser building a whole
  // surface asks for all of them, and paying for a round trip per command would
  // be the only reason to hand-cache it host-side.
  uint32 method_id = 1;
}
message GetCommandSpecResponse {
  repeated SpecCommand commands = 1;
}

// WHAT AN APP'S MESSAGES LOOK LIKE — enough for a client that was never built
// against them to render its requests and responses.
//
// # Why this is HERE and not in the vendored standard set
//
// It was briefly in `devalbo.dlc.std.v1`, on the reasoning that describing your
// own schema is an app-level concern. It is not: an app supplies four SCALARS to
// `platform.SetSchema` and never constructs this message. The only code that
// builds or reads one is a host or a client — which is the definition of
// `devalbo.ilc.v1`.
//
// The mistake had a cost that named itself: `platform.proto` importing across
// packages made the generated `platform.pb.ts` import a file no scaffolded app
// generates, and the scaffold's browser tests failed on a missing module. The
// standard set has a first test — "more than one app would declare it" — and
// this fails it.
//
// # The problem
//
// A host can already encode a request BY NAME: `SpecFlag` describes each request
// field, which is how a badge collected `-set opponent=<enum>` for an app it
// knows nothing about. The response half stops short. `SpecResult` describes
// flat fields only, so a reply whose payload is a nested message arrives as
// `field 1 (not in the spec) 19 bytes: 0a09…` — correct bytes, no names.
//
// Extending `SpecResult` to nest would mean re-implementing a descriptor one
// feature at a time: first nesting, then oneofs, then maps, then well-known
// types, each arriving as a schema change plus four hand-decoders.
//
// # Prior art, and where it stops
//
// `react-qroma-lib` renders arbitrary protobuf messages in a browser from
// `@protobuf-ts` runtime metadata — one component walks `IMessageType.fields[]`,
// branches on `field.kind` (scalar / enum / message / oneof), and produces a
// form. That proves generic rendering works from field metadata alone.
//
// What it does not do is DISCOVERY: its registry is populated from the app's
// generated TypeScript, imported at build time, so the page must be compiled
// against the same protos as the firmware. That is fine when one team ships
// both. It is exactly the gap when a web page meets a device over WebSerial that
// it was not built for.
//
// # What this carries, and why each field exists
//
// Four fields answering four different questions. They are not redundant:
// `schema_id` says WHICH, `version` says HOW OLD, `url` says WHERE, and
// `descriptor` says HERE.
message SchemaInfo {
  // THE IDENTITY: a content hash of `descriptor`, whether or not it is carried.
  //
  // This is the field that makes every other one trustworthy. A client that
  // fetches `url` compiles what it got, hashes it, and compares: match means the
  // names it is about to show belong to the bytes it is about to show them for.
  //
  // WITHOUT IT A URL IS A LIE WAITING TO HAPPEN. The device was built from one
  // version of a .proto; the URL resolves to whatever is there now. When they
  // drift, a client renders wrong field names over correct bytes and nothing
  // says so — the same silent-disagreement failure as an enum value transcribed
  // by hand, one layer up.
  //
  // The payload catalog already learned this: it prints a checksum per entry
  // because size alone could not say WHICH BUILD was on the board.
  string schema_id = 1;

  // THE ORDER: the app's own version for this schema, e.g. "1.4.0".
  //
  // NOT A SUBSTITUTE FOR `schema_id`, and not substitutable by it. A hash can
  // only say same-or-different; it cannot say the device is OLDER than a page
  // expects, which is the question a client actually asks when it wants to
  // decide whether to degrade gracefully or refuse.
  //
  // Free text rather than three integers: an app may version however it likes,
  // and a platform that insisted on semver would be inventing a policy it cannot
  // enforce. Clients that want ordering can parse it; clients that want equality
  // have `schema_id`.
  string version = 2;

  // WHERE A COPY MAY BE FETCHED. A HINT, never the truth.
  //
  // The point is size: a URL is tens of bytes where a descriptor is tens of
  // kilobytes, which is the difference between "always ship it" and "opt in" on
  // an Arduino-class device. It is safe to treat as a hint precisely because
  // `schema_id` makes what comes back verifiable.
  //
  // A client that cannot reach it — offline, no CORS, air-gapped bench — has
  // lost an optimisation, not correctness.
  string url = 3;

  // THE SCHEMA ITSELF: a serialized FileDescriptorSet, if the app embedded one.
  //
  // The offline answer, and the only one that needs no network at all. Costs
  // roughly 5-15 KB in the artifact, so it is opt-in per app rather than
  // automatic — a badge on a bench renders fully, a microcontroller counting
  // bytes ships `schema_id` and `url` alone.
  //
  // A FileDescriptorSet rather than a bespoke shape because every protobuf
  // toolchain already reads one: protobuf-es and protobuf-ts in a browser,
  // protoreflect in Go, `buf` on a command line. A format of our own would mean
  // writing a reader for each.
  bytes descriptor = 4;
}

message GetSchemaRequest {}
message GetSchemaResponse {
  // Absent when the app declared none. AN EMPTY ANSWER IS STILL AN ANSWER: a
  // client learns the app cannot describe itself and falls back to the flat
  // `SpecResult`, rather than waiting on a verb that was never going to reply.
  SchemaInfo schema = 1;
}

message GetCommandSurfaceRequest {}
message GetCommandSurfaceResponse {
  // Every registered method_id, ASCENDING. Sorted because map iteration order
  // is unspecified in Go, and an unsorted answer would make the parity diff
  // fail at random — a flake that would read as a real divergence.
  //
  // Ids rather than names: the id is the wire and the name is cosmetic
  // (AGENTS.md §3b), and the caller already has the names — it holds the
  // generated clispec and is asking which of those are live.
  repeated uint32 method_ids = 1;
}

// Filesystem export/import — the first-class platform primitive (§7.3). An
// app's whole state is a filesystem tree, so one bundle moves it between the
// terminal, the browser, and an embedded device.
enum BundleFormat {
  BUNDLE_FORMAT_UNSPECIFIED = 0; // treat as BFT (the default)
  BUNDLE_FORMAT_BFT = 1;         // single human-readable JSON
  BUNDLE_FORMAT_ZIP = 2;
  BUNDLE_FORMAT_PROTO = 3;
}

// How an import treats what is already on disk. Explicit because the default
// (merge) silently cannot express a deletion: dropping a file from a bundle and
// re-importing leaves the old file in place.
enum ImportMode {
  IMPORT_MODE_UNSPECIFIED = 0; // treat as MERGE
  IMPORT_MODE_MERGE = 1;       // write the bundle over whatever is there
  IMPORT_MODE_REPLACE = 2;     // clear the destination first, then write
}

message ExportFsRequest {
  string prefix = 1 [
    (devalbo.options.v1.help) = "subtree to export (default: whole root)",
    (devalbo.options.v1.short) = "p"
  ];
  BundleFormat format = 2 [
    (devalbo.options.v1.help) = "bundle format",
    (devalbo.options.v1.default) = "BUNDLE_FORMAT_BFT",
    (devalbo.options.v1.short) = "f"
  ];
}
message ExportFsResponse {
  bytes bundle = 1;
}

message ImportFsRequest {
  bytes bundle = 1 [
    (devalbo.options.v1.help) = "bundle bytes to import",
    (devalbo.options.v1.required) = true,
    // A path, or `-` for stdin. Positional so `import-fs backup.json` reads
    // the way it always has.
    (devalbo.options.v1.cli_positional) = 1
  ];
  string prefix = 2 [
    (devalbo.options.v1.help) = "destination subtree",
    (devalbo.options.v1.short) = "p"
  ];
  ImportMode mode = 3 [
    (devalbo.options.v1.help) = "merge into the destination, or replace it",
    (devalbo.options.v1.default) = "IMPORT_MODE_MERGE"
  ];
}
message ImportFsResponse {
  repeated string files = 1;
}

// reset-fs — delete a subtree (§7.3). The counterpart that makes "replace"
// expressible on its own, and the only way to re-scaffold over an existing tree.
message ResetFsRequest {
  string prefix = 1 [
    (devalbo.options.v1.help) = "subtree to delete (default: whole root)",
    (devalbo.options.v1.short) = "p"
  ];
}
message ResetFsResponse {
  repeated string removed = 1; // top-level entries that were deleted
}

// ---- the derived index (§6.2, §7.1) ---------------------------------------

message RebuildIndexRequest {}
message RebuildIndexResponse {
  // How many entries the rebuilt index holds. The one number worth returning:
  // it makes "rebuild did nothing" distinguishable from "rebuild ran and the
  // collection is empty", which is the difference between a broken rebuilder and
  // an empty store.
  uint32 entries = 1;
}

message DataChangedEvent {
  option (devalbo.options.v1.topic) = "ilc.data-changed";

  // Root-relative subtree that changed. Empty means the whole root.
  string prefix = 1;
  // The command that caused it, as a method_id — enough for a subscriber to
  // ignore its own writes without the platform having to model identity.
  uint32 method = 2;
}
