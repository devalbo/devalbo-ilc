# BRING-UP FIRMWARE for the Pimoroni Tufty 2350 (RP2350B).
#
# One question at a time (docs/EMBEDDED-PLAN.md Phase 0). These are MILESTONES,
# never "steps" — BRINGUP.md reserves that word for what a human does, and
# "stage" for the checks the firmware runs:
#
#   milestone 1  does Wasmtime no_std + Pulley + component-model LINK, and does
#                the board boot with a PSRAM-backed allocator and a working UART?
#   milestone 2  can Pulley instantiate a TRIVIAL component here?
#   milestone 3  can it run tictactoe's 2.21 MB .cwasm?
#
# Separate crate from `dlc-platform-embedded` because that one builds for the
# HOST (std, Phase 1's harness) and this one is bare metal. Same source will be
# shared once Phase 2 turns the host runtime no_std; today they are deliberately
# apart so a mistake in one cannot break the other's build.
[package]
name = "dlc-rp2350-bringup"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- the board ---------------------------------------------------------------
rp235x-hal = { version = "0.3", features = ["critical-section-impl", "rt"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "1"
panic-halt = "1"

# --- the heap ----------------------------------------------------------------
# Wasmtime needs `alloc`, and 520 KB of SRAM will not hold a component's linear
# memory — so the heap is the 8 MB of PSRAM. See src/main.rs.
embedded-alloc = "0.6"

# --- the inherited host (EMBEDDED-PLAN D3) -----------------------------------
# The SAME crate the QEMU harness and the laptop tools build, minus `std`:
# `minimal.rs` satisfies every import a component declares, and `catalog.rs` is
# the payload-region format. Depending on it rather than copying it is the whole
# point of the split — a fix to the WASI shim reaches the board, the emulator and
# the laptop at once, and the RAM figures measured under QEMU describe the code
# that actually ships here.
dlc-platform-embedded = { path = "..", default-features = false }

# --- the runtime under test --------------------------------------------------
# `default-features = false` is what makes this no_std at all. `pulley` is the
# interpreter (no JIT on this chip); `component-model` is the whole reason this
# tier can run the same artifact as the browser.
wasmtime = { version = "=46.0.1", default-features = false, features = [
    "runtime",
    "component-model",
    "pulley",
    # NOTHING ELSE. Every extra here was added while chasing the stock wasmtime
    # CLI's feature set (gc, gc-copying, async) and every one of them is code on
    # a microcontroller. Since `dlc-precompile` now builds the artifact with a
    # matching compiler, both sides can be lean instead of both being fat.
] }

# The wasi:io/{error,poll,streams} implementation, as TRAITS this crate impls —
# so the badge does not hand-write 15 stream functions. `default-features =
# false` is what makes it no_std; its default is std, like wasmtime's.
wasmtime-wasi-io = { version = "=46.0.1", default-features = false }
embedded-graphics = "0.8.2"
mipidsi = "0.10.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[profile.release]
# `panic = abort` because unwinding needs machinery this target does not have.
panic = "abort"
# Wasmtime is large; optimise for size and let LTO drop what is unreachable.
opt-level = "s"
lto = true
codegen-units = 1
