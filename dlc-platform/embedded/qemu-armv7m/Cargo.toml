# The badge firmware, on an emulator — so the 32-bit claims can be tested
# without waiting for hardware (docs/EMBEDDED-PLAN.md Phase 0).
#
# WHY THIS EXISTS. Two things were untestable on a 64-bit laptop: whether
# `pulley32` actually executes our component (a host runs only its own pointer
# width), and how much RAM it takes. QEMU's `mps2-an505` is a Cortex-M33 — the
# RP2350's CPU class — so both become answerable.
#
# WHAT IT IS NOT: the badge. No RP2350 peripherals, no PSRAM, 4 MB of RAM where
# the badge has 520 KB. The heap here is therefore pinned to the badge's size on
# purpose, so "does it fit" means something.
[package]
name = "dlc-qemu-armv7m"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
# Semihosting instead of a UART: QEMU implements it, and it needs no peripheral
# model. This is the one place the emulator and the badge legitimately differ.
cortex-m-semihosting = "0.5"
# `exit`, and it is not optional here. Without that feature this crate's panic
# handler prints and then ends in `loop {}` — which on real hardware is the right
# default (halt and stay inspectable) and under an emulator means **QEMU never
# exits and spins a core forever**. Three such processes were found running after
# a debugging session; each panic leaves one behind, silently, because the log
# still shows the panic message and looks finished.
#
# With it, a panic exits QEMU with a failure status, so `make qemu` terminates and
# reports instead of hanging.
panic-semihosting = { version = "0.6", features = ["exit"] }
embedded-alloc = "0.6"

# The INHERITED host (EMBEDDED-PLAN D3), built without `std` — the same crate the
# laptop harness uses, minus `host.rs`. Depending on it rather than copying it is
# the whole point: a fix to the WASI shim reaches the board, the emulator and the
# laptop at once. `minimal.rs` is what satisfies the component's imports here.
dlc-platform-embedded = { path = "..", default-features = false }

# EXACT VERSION, and it must equal the pin in every other crate here —
# `dlc-platform-embedded`, `rp2350`, `precompile`, `parity`. A `.cwasm` is
# version-locked to the wasmtime that produced it, and a mismatch reports
# "compilation settings are not compatible with the native host", a message that
# never mentions versions.
#
# NOT coupled to devbox's `wasmtime` CLI, despite what this comment used to say.
# That was true while `wasmtime compile` produced the artifact; `dlc-precompile`
# does now, so the CLI is not in the artifact path at all — `preflight.sh` only
# checks that it exists. devbox pins 46.0.1 anyway, because a floating `@latest`
# beside five exact pins is a trap even when nothing currently reads it.
#
# ON UPGRADING, and this is not boilerplate: bump all five together, regenerate
# the .cwasm, AND diff `platform.rs` against wasmtime's
# `runtime/vm/sys/custom/capi.rs`. The TLS hooks changed signature between 35 and
# 46 with no compiler or linker error — `extern "C"` links by name — and the
# breakage only appears at instantiation. See EMBEDDED-PLAN Phase 0d.
wasmtime = { version = "=46.0.1", default-features = false, features = [
    "runtime",
    "component-model",
    "pulley",
    # NOTHING ELSE. Every extra here was added while chasing the stock wasmtime
    # CLI's feature set (gc, gc-copying, async) and every one of them is code on
    # a microcontroller. Since `dlc-precompile` now builds the artifact with a
    # matching compiler, both sides can be lean instead of both being fat.
] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
