[package]
name = "devalbo-ilc"
version = "0.1.0"
edition = "2021"
description = "ILC Rust SDK (generated capability traits)"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "hello"
path = "examples/hello.rs"
